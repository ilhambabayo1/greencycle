<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}GreenCycle{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="logo">GreenCycle</a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/about">About</a>
    </div>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>GreenCycle — Recycle today, thrive tomorrow.</p>
  </footer>

  <script src="{{ url_for('static', path='/js/main.js') }}"></script>
</body>
</html>
